[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-tool-sdk"
version = "0.1.0"
description = "Universal tool-schema optimisation layer for LLM agent frameworks"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["dynamic_tool_sdk*"]
